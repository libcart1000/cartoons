<html lang="en">
    <head>
        <meta charset=utf-8/>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <style>
            .video_wrapper {
    display: table;
    position: relative;
    width: 100%;
}

 
        </style>
    </head>
    <body>

    <div class="video_wrapper">
        <video class="post_video" loop>
                <source src="https://ww.b98.tv/video/The-Scooby-Doo-Show-The-Creepy-Heap-From-The-Deep.mp4" type="video/mp4">
        </video>
     </div>

    <div class="video_wrapper">
        <video class="post_video" loop>
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        </video>
     </div>

        
<script type="text/javascript" >
$(document).ready(function() {
$('.post_video').parent().click(function() {
    var currentVideo = $(this).children(".post_video").get(0);
    var allVideos = $(".post_video");
    // we have to loop throw all videos exept for the current one and pause them.
    allVideos.each(function(){
       if (currentVideo != this)
       this.pause();
    });

    if (currentVideo.paused){        
        currentVideo.play();   
        $(this).children(".playpause").fadeOut();
    } else {       
        currentVideo.pause();
        $(this).children(".playpause").fadeIn();
    }
});
</script>    

        
    </body>
</html>
