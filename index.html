<html lang="en">
    <head>
        <meta charset=utf-8/>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    </head>
    <body>
        <div id='player'>
            <video width="500" height="300" src="https://raw.githubusercontent.com/libcart1000/cartoons/refs/heads/main/playlist.m3u8" controls autoplay>
            </video>
        </div>
<script type="text/javascript" >
$(document).ready(function() {
$('.post_video').parent().click(function() {
    var currentVideo = $(this).children(".post_video").get(0);
    var allVideos = $(".post_video");
    // we have to loop throw all videos exept for the current one and pause them.
    allVideos.each(function(){
       if (currentVideo != this)
       this.pause();
    });

    if (currentVideo.paused){        
        currentVideo.play();   
        $(this).children(".playpause").fadeOut();
    } else {       
        currentVideo.pause();
        $(this).children(".playpause").fadeIn();
    }
});
</script>    

        
    </body>
</html>
